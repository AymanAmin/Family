name: Build Family Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build installable APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare Family APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Family.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Family-Android-APK
          path: Family.apk
          if-no-files-found: error
          retention-days: 90
