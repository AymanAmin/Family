name: One-time fix app navigation history

on:
  push:
    paths:
      - '.github/workflows/fix-app-navigation-history.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch App navigation history
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('src/App.tsx')
          text = path.read_text(encoding='utf-8')

          if "window.history.pushState({ familyAppRoute: route }, '', nextHash)" in text:
              print('Navigation history patch is already applied.')
              raise SystemExit(0)

          anchor = "  useEffect(() => {\n    if (!routeReady) return\n\n    let route: string = view\n"
          start = text.find(anchor)
          if start < 0:
              raise SystemExit('Navigation sync effect start was not found.')

          end_marker = "  }, [routeReady, view, selectedPerson?.id, selectedFamily?.id])"
          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit('Navigation sync effect end was not found.')
          end += len(end_marker)
          if end < len(text) and text[end] == '\n':
              end += 1

          old_block = text[start:end]
          if "window.history.replaceState(null, '', nextHash)" not in old_block:
              raise SystemExit('Expected replaceState call was not found inside navigation effect.')

          new_block = """  useEffect(() => {
    if (!routeReady) return

    function restoreHistoryRoute() {
      const rawHash = window.location.hash
      if (rawHash.startsWith('#access_token=') || rawHash.startsWith('#error=')) return

      const route = decodeURIComponent(rawHash.replace(/^#\\/?/, ''))
      const [target, id] = route.split('/')

      if (target === 'person' && id) {
        void openPersonById(id)
      } else if (target === 'family' && id) {
        void openFamilyById(id)
      } else if (target === 'news' || target === 'search' || target === 'tree' || target === 'add' || target === 'admin' || target === 'account') {
        setView(target as View)
        window.scrollTo({ top: 0, behavior: 'auto' })
      } else {
        setView('home')
        window.scrollTo({ top: 0, behavior: 'auto' })
      }
    }

    window.addEventListener('popstate', restoreHistoryRoute)
    return () => window.removeEventListener('popstate', restoreHistoryRoute)
  }, [routeReady])

  useEffect(() => {
    if (!routeReady) return

    let route: string = view
    if (view === 'person' && selectedPerson?.id) route = `person/${selectedPerson.id}`
    if (view === 'family' && selectedFamily?.id) route = `family/${selectedFamily.id}`

    const nextHash = `#/${route}`
    if (window.location.hash !== nextHash) {
      window.history.pushState({ familyAppRoute: route }, '', nextHash)
    }
  }, [routeReady, view, selectedPerson?.id, selectedFamily?.id])
"""

          path.write_text(text[:start] + new_block + text[end:], encoding='utf-8')
          print('Patched src/App.tsx')
          PY

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- src/App.tsx; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "Ayman Amin Ali Amin"
          git config user.email "ayman1793@hotmail.com"
          git add src/App.tsx
          git commit -m "Fix Android back navigation history"
          git push
