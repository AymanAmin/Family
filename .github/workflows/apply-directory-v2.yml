name: Apply directory v2 integration

on:
  push:
    paths:
      - 'scripts/trigger-directory-v2.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply integration
        run: python3 scripts/apply-directory-v2.py
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx supabase/SETUP.sql
          if ! git diff --cached --quiet; then
            git commit -m "Integrate paginated directory and extended kinship"
            git push
          fi
