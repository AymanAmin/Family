<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#b77914" />
    <meta name="description" content="صلة — منصة العائلة وصلة القرابة." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="صلة" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest?v=14" />
    <link rel="preload" as="image" href="%BASE_URL%brand/sila-approved-v4.jpg?v=14" fetchpriority="high" />
    <link rel="icon" type="image/jpeg" href="%BASE_URL%brand/sila-approved-v4.jpg?v=14" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon-approved-v4.jpg?v=14" />
    <title>صلة القرابة</title>
    <style>
      #sila-splash {
        position: fixed;
        z-index: 2147483647;
        inset: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(circle at 14% 14%, rgba(239, 190, 86, .20), transparent 23rem),
          radial-gradient(circle at 88% 84%, rgba(183, 121, 20, .12), transparent 22rem),
          linear-gradient(180deg, #fffdf8 0%, #fff5df 100%);
        opacity: 1;
        visibility: visible;
        transition: opacity .38s ease, visibility .38s ease;
      }
      #sila-splash::before,
      #sila-splash::after {
        position: absolute;
        width: min(64vw, 360px);
        aspect-ratio: 1;
        border: 1px solid rgba(183, 121, 20, .14);
        border-radius: 50%;
        content: '';
      }
      #sila-splash::before { top: -18%; left: -18%; }
      #sila-splash::after { right: -22%; bottom: -20%; }
      #sila-splash.sila-splash-hide {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .sila-splash-inner {
        position: relative;
        display: grid;
        width: min(72vw, 330px);
        place-items: center;
        padding: 18px;
      }
      .sila-splash-inner img {
        display: block;
        width: 100%;
        height: auto;
        border-radius: 30px;
        box-shadow: 0 26px 72px rgba(126, 79, 8, .20);
      }
      .sila-splash-loader {
        width: 62px;
        height: 4px;
        margin-top: 24px;
        overflow: hidden;
        border-radius: 99px;
        background: rgba(183, 121, 20, .16);
      }
      .sila-splash-loader::after {
        display: block;
        width: 48%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #b77914, #e3ad42);
        content: '';
        animation: silaSplashMove 1.05s ease-in-out infinite alternate;
      }
      @keyframes silaSplashMove { to { transform: translateX(-108%); } }
      @media (max-width: 430px) {
        .sila-splash-inner { width: min(70vw, 286px); padding: 12px; }
        .sila-splash-inner img { border-radius: 26px; }
      }
      @media (prefers-reduced-motion: reduce) {
        .sila-splash-loader::after { animation: none; }
        #sila-splash { transition-duration: .01ms; }
      }
    </style>
    <script>
      (() => {
        window.__silaInstallPrompt = null
        window.addEventListener('beforeinstallprompt', (event) => {
          event.preventDefault()
          window.__silaInstallPrompt = event
          window.dispatchEvent(new Event('sila:install-prompt-ready'))
        })
        window.addEventListener('appinstalled', () => {
          window.__silaInstallPrompt = null
        })
      })()
    </script>
    <script>
      (() => {
        if (!('serviceWorker' in navigator)) return
        navigator.serviceWorker.register('%BASE_URL%sw.js', {
          scope: '%BASE_URL%',
          updateViaCache: 'none',
        }).catch((error) => console.warn('Early service worker registration failed.', error))
      })()
    </script>
    <script>
      (() => {
        const RETRY_KEY = 'sila-pwa-install-reevaluate-v14'
        const CHECK_PARAM = 'pwa-install-check'
        const ua = navigator.userAgent
        const isChromeAndroid = /Android/i.test(ua) && /Chrome\//i.test(ua) && !/SamsungBrowser|EdgA\/|OPR\//i.test(ua)
        if (!isChromeAndroid) return

        const cleanCheckParam = () => {
          const url = new URL(window.location.href)
          if (!url.searchParams.has(CHECK_PARAM)) return
          url.searchParams.delete(CHECK_PARAM)
          window.history.replaceState(window.history.state, '', url.toString())
        }

        const isAlreadyInstalled = async () => {
          if (typeof navigator.getInstalledRelatedApps !== 'function') return false
          try {
            const apps = await navigator.getInstalledRelatedApps()
            return apps.some((app) => app.platform === 'webapp' && String(app.url || '').includes('manifest.webmanifest'))
          } catch {
            return false
          }
        }

        const ensureServiceWorkerController = async () => {
          if (!('serviceWorker' in navigator)) return
          try {
            const registration = await navigator.serviceWorker.ready
            await registration.update().catch(() => undefined)
            if (navigator.serviceWorker.controller) return
            await new Promise((resolve) => {
              let done = false
              const finish = () => {
                if (done) return
                done = true
                navigator.serviceWorker.removeEventListener('controllerchange', finish)
                resolve()
              }
              navigator.serviceWorker.addEventListener('controllerchange', finish)
              window.setTimeout(finish, 1200)
            })
          } catch (error) {
            console.warn('Chrome installability service worker check failed.', error)
          }
        }

        const runNativePrompt = async (promptEvent, button, label) => {
          await promptEvent.prompt()
          const choice = await promptEvent.userChoice
          window.__silaInstallPrompt = null
          sessionStorage.removeItem(RETRY_KEY)
          cleanCheckParam()
          if (choice.outcome === 'accepted') {
            button.remove()
          } else {
            button.disabled = false
            if (label) label.textContent = 'تثبيت التطبيق'
          }
        }

        window.addEventListener('beforeinstallprompt', () => {
          sessionStorage.removeItem(RETRY_KEY)
          cleanCheckParam()
        })

        window.addEventListener('appinstalled', () => {
          sessionStorage.removeItem(RETRY_KEY)
          cleanCheckParam()
          document.querySelector('.pwa-install-fab')?.remove()
        })

        document.addEventListener('click', async (event) => {
          const target = event.target
          if (!(target instanceof Element)) return
          const button = target.closest('.pwa-install-fab')
          if (!(button instanceof HTMLButtonElement)) return

          event.preventDefault()
          event.stopPropagation()
          event.stopImmediatePropagation()

          const label = button.querySelector('span:last-child')
          let promptEvent = window.__silaInstallPrompt || null
          if (promptEvent) {
            button.disabled = true
            if (label) label.textContent = 'جارٍ فتح التثبيت…'
            try {
              await runNativePrompt(promptEvent, button, label)
            } catch (error) {
              console.warn('Chrome native install prompt failed.', error)
              button.disabled = false
              if (label) label.textContent = 'تثبيت التطبيق'
            }
            return
          }

          if (button.dataset.silaInstallBusy === '1') return
          button.dataset.silaInstallBusy = '1'
          button.disabled = true
          if (label) label.textContent = 'فحص التثبيت…'

          try {
            if (await isAlreadyInstalled()) {
              button.remove()
              return
            }

            await ensureServiceWorkerController()
            promptEvent = window.__silaInstallPrompt || null

            if (promptEvent) {
              try {
                await runNativePrompt(promptEvent, button, label)
                return
              } catch (error) {
                console.warn('Chrome prompt became ready after recheck but could not open.', error)
              }
            }

            if (sessionStorage.getItem(RETRY_KEY) !== '1') {
              sessionStorage.setItem(RETRY_KEY, '1')
              const url = new URL(window.location.href)
              url.searchParams.set(CHECK_PARAM, '14')
              window.location.replace(url.toString())
              return
            }
          } finally {
            delete button.dataset.silaInstallBusy
            if (button.isConnected) {
              button.disabled = false
              if (label) label.textContent = 'تثبيت التطبيق'
            }
          }
        }, true)
      })()
    </script>
  </head>
  <body>
    <div id="sila-splash" role="status" aria-label="جارٍ فتح صلة القرابة">
      <div class="sila-splash-inner">
        <img src="%BASE_URL%brand/sila-approved-v4.jpg?v=14" alt="شعار صلة القرابة" fetchpriority="high" decoding="sync" />
        <span class="sila-splash-loader" aria-hidden="true"></span>
      </div>
    </div>
    <div id="root"></div>
    <script>
      (() => {
        let hidden = false
        const hideSplash = () => {
          if (hidden) return
          hidden = true
          const splash = document.getElementById('sila-splash')
          if (!splash) return
          splash.classList.add('sila-splash-hide')
          window.setTimeout(() => splash.remove(), 450)
        }
        window.addEventListener('load', () => window.setTimeout(hideSplash, 550), { once: true })
        window.setTimeout(hideSplash, 4200)
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script type="module" src="/src/mobile-layout-polish-entry.ts"></script>
  </body>
</html>
