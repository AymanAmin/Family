name: Apply person profile combined add flow

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/apply-person-profile-add-flow.mjs'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply source patch
        run: node scripts/apply-person-profile-add-flow.mjs

      - name: Install dependencies
        run: npm install

      - name: Type-check and build
        run: npm run build

      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/main.tsx src/person-profile-actions.css
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "Add combined person creation from profile"
          git push origin main
