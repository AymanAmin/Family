name: Sync latest migrations into SETUP

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-setup-latest.yml'
      - 'scripts/sync-setup-latest.mjs'
      - 'supabase/migrations/**'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync SETUP.sql
        run: node scripts/sync-setup-latest.mjs
      - name: Commit SETUP.sql
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/SETUP.sql
          if ! git diff --cached --quiet; then
            git commit -m "Sync latest migrations into SETUP"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
