name: Apply family tree explorer

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-family-tree-explorer.mjs'
      - '.github/workflows/apply-family-tree-explorer.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Integrate family tree screen
        run: node scripts/apply-family-tree-explorer.mjs
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify production build
        run: npm run build
      - name: Commit integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          if git diff --cached --quiet; then
            echo "App already integrated."
          else
            git commit -m "Integrate family tree explorer"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
