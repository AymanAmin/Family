    <title>صلة القرابة</title>
    <script>
      (() => {
        const oldName = 'صلة المنطقة'
        const newName = 'صلة القرابة'
        const replaceBrandText = (root) => {
          const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT)
          let node
          while ((node = walker.nextNode())) {
            if (node.nodeValue && node.nodeValue.includes(oldName)) {
              node.nodeValue = node.nodeValue.replaceAll(oldName, newName)
            }
          }
        }
        document.addEventListener('DOMContentLoaded', () => {
          replaceBrandText(document.body)
          new MutationObserver((mutations) => {
            for (const mutation of mutations) {
              for (const addedNode of mutation.addedNodes) {
                if (addedNode.nodeType === Node.TEXT_NODE) {
                  if (addedNode.nodeValue && addedNode.nodeValue.includes(oldName)) addedNode.nodeValue = addedNode.nodeValue.replaceAll(oldName, newName)
                } else if (addedNode.nodeType === Node.ELEMENT_NODE) {
                  replaceBrandText(addedNode)
                }
              }
            }
          }).observe(document.body, { childList: true, subtree: true })
        })
      })()
    </script>
