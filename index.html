    <title>صلة القرابة</title>
    <style>
      #sila-splash {
        position: fixed;
        z-index: 2147483647;
        inset: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(circle at 14% 14%, rgba(239, 190, 86, .20), transparent 23rem),
          radial-gradient(circle at 88% 84%, rgba(183, 121, 20, .12), transparent 22rem),
          linear-gradient(180deg, #fffdf8 0%, #fff5df 100%);
        opacity: 1;
        visibility: visible;
        transition: opacity .38s ease, visibility .38s ease;
      }
      #sila-splash::before,
      #sila-splash::after {
        position: absolute;
        width: min(64vw, 360px);
        aspect-ratio: 1;
        border: 1px solid rgba(183, 121, 20, .14);
        border-radius: 50%;
        content: '';
      }
      #sila-splash::before { top: -18%; left: -18%; }
      #sila-splash::after { right: -22%; bottom: -20%; }
      #sila-splash.sila-splash-hide {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .sila-splash-inner {
        position: relative;
        display: grid;
        width: min(72vw, 330px);
        place-items: center;
        padding: 18px;
      }
      .sila-splash-inner img {
        display: block;
        width: 100%;
        height: auto;
        border-radius: 30px;
        box-shadow: 0 26px 72px rgba(126, 79, 8, .20);
      }
      .sila-splash-loader {
        width: 62px;
        height: 4px;
        margin-top: 24px;
        overflow: hidden;
        border-radius: 99px;
        background: rgba(183, 121, 20, .16);
      }
      .sila-splash-loader::after {
        display: block;
        width: 48%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #b77914, #e3ad42);
        content: '';
        animation: silaSplashMove 1.05s ease-in-out infinite alternate;
      }
      @keyframes silaSplashMove { to { transform: translateX(-108%); } }
      @media (max-width: 430px) {
        .sila-splash-inner { width: min(70vw, 286px); padding: 12px; }
        .sila-splash-inner img { border-radius: 26px; }
      }
      @media (prefers-reduced-motion: reduce) {
        .sila-splash-loader::after { animation: none; }
        #sila-splash { transition-duration: .01ms; }
      }
    </style>
    <script>
      (() => {
        const resetKey = 'sila-brand-cache-reset-v11'
        if (localStorage.getItem(resetKey) === 'done') return
        localStorage.setItem(resetKey, 'running')

        window.addEventListener('load', async () => {
          try {
            if ('serviceWorker' in navigator) {
              const registrations = await navigator.serviceWorker.getRegistrations()
              await Promise.all(registrations.map((registration) => registration.unregister()))
            }
            if ('caches' in window) {
              const keys = await caches.keys()
              await Promise.all(keys.filter((key) => key.startsWith('sila-')).map((key) => caches.delete(key)))
            }
          } catch (error) {
            console.warn('Brand cache reset could not fully complete.', error)
          } finally {
            localStorage.setItem(resetKey, 'done')
            const url = new URL(window.location.href)
            if (url.searchParams.get('brand') !== 'v11') {
              url.searchParams.set('brand', 'v11')
              window.location.replace(url.toString())
            }
          }
        }, { once: true })
      })()
    </script>

  <body>
    <div id="sila-splash" role="status" aria-label="جارٍ فتح صلة القرابة">
      <div class="sila-splash-inner">
        <img src="/Family/brand/sila-approved-v4.jpg?v=11" alt="شعار صلة القرابة" fetchpriority="high" decoding="sync" />
        <span class="sila-splash-loader" aria-hidden="true"></span>
      </div>
    </div>
    <div id="root"></div>
    <script>
      (() => {
        let hidden = false
        const hideSplash = () => {
          if (hidden) return
          hidden = true
          const splash = document.getElementById('sila-splash')
          if (!splash) return
          splash.classList.add('sila-splash-hide')
          window.setTimeout(() => splash.remove(), 450)
        }
        window.addEventListener('load', () => window.setTimeout(hideSplash, 550), { once: true })
        window.setTimeout(hideSplash, 4200)
      })()
    </script>
