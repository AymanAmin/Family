name: Apply persistent route navigation

on:
  push:
    paths:
      - '.github/workflows/apply-route-persistence.yml'
      - 'scripts/apply-route-persistence.mjs'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply route patch
        run: node scripts/apply-route-persistence.mjs
      - name: Verify build
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Commit route changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx index.html
          if ! git diff --cached --quiet; then
            git commit -m "Persist current screen across refresh"
            git push
          fi
