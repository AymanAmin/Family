name: Sync latest migrations into SETUP

on:
  push:
    paths:
      - '.github/workflows/sync-setup-latest.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync SETUP.sql
        run: node scripts/sync-setup-latest.mjs
      - name: Commit SETUP.sql
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/SETUP.sql
          if ! git diff --cached --quiet; then
            git commit -m "Sync latest migrations into SETUP"
            git push
          fi
