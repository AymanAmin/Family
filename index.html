    <title>صلة القرابة</title>
    <style>
      #sila-splash {
        position: fixed;
        z-index: 2147483647;
        inset: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(circle at 16% 16%, rgba(191,174,143,.12), transparent 22rem),
          radial-gradient(circle at 84% 82%, rgba(191,174,143,.09), transparent 20rem),
          linear-gradient(180deg, #fbf8f1 0%, #f3ecdf 100%);
        opacity: 1;
        visibility: visible;
        transition: opacity .38s ease, visibility .38s ease;
      }
      #sila-splash::before,
      #sila-splash::after {
        position: absolute;
        width: min(64vw, 360px);
        aspect-ratio: 1;
        border: 1px solid rgba(156,137,105,.13);
        border-radius: 50%;
        content: '';
      }
      #sila-splash::before { top: -18%; left: -18%; }
      #sila-splash::after { right: -22%; bottom: -20%; }
      #sila-splash.sila-splash-hide {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .sila-splash-inner {
        position: relative;
        display: grid;
        width: min(78vw, 390px);
        place-items: center;
        padding: 18px;
      }
      .sila-splash-inner img {
        display: block;
        width: 100%;
        height: auto;
        border-radius: 28px;
        box-shadow: 0 26px 70px rgba(82,68,49,.14);
      }
      .sila-splash-loader {
        width: 56px;
        height: 4px;
        margin-top: 22px;
        overflow: hidden;
        border-radius: 99px;
        background: rgba(117,101,78,.14);
      }
      .sila-splash-loader::after {
        display: block;
        width: 48%;
        height: 100%;
        border-radius: inherit;
        background: #9b896f;
        content: '';
        animation: silaSplashMove 1.05s ease-in-out infinite alternate;
      }
      @keyframes silaSplashMove { to { transform: translateX(-108%); } }
      @media (max-width: 430px) {
        .sila-splash-inner { width: min(82vw, 340px); padding: 12px; }
        .sila-splash-inner img { border-radius: 24px; }
      }
      @media (prefers-reduced-motion: reduce) {
        .sila-splash-loader::after { animation: none; }
        #sila-splash { transition-duration: .01ms; }
      }
    </style>

  <body>
    <div id="sila-splash" role="status" aria-label="جارٍ فتح صلة القرابة">
      <div class="sila-splash-inner">
        <img src="/Family/brand/sila-app-icon.png" alt="صلة القرابة — Kinship Connection" />
        <span class="sila-splash-loader" aria-hidden="true"></span>
      </div>
    </div>
    <div id="root"></div>
    <script>
      (() => {
        let hidden = false
        const hideSplash = () => {
          if (hidden) return
          hidden = true
          const splash = document.getElementById('sila-splash')
          if (!splash) return
          splash.classList.add('sila-splash-hide')
          window.setTimeout(() => splash.remove(), 450)
        }
        window.addEventListener('load', () => window.setTimeout(hideSplash, 550), { once: true })
        window.setTimeout(hideSplash, 4200)
      })()
    </script>
  </body>
