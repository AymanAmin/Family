name: Harden scoped role authorization

on:
  push:
    branches: [main]
    paths:
      - 'scripts/harden-phase13-roles.py'
      - '.github/workflows/harden-phase13-roles.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Harden SQL
        run: python3 scripts/harden-phase13-roles.py
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/202608070017_full_role_scopes_and_moderation.sql
          if ! git diff --cached --quiet; then
            git commit -m "Harden scoped role authorization"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
