    <script>
      (() => {
        const resetKey = 'sila-brand-cache-reset-v8'
        if (localStorage.getItem(resetKey) === 'done') return
        localStorage.setItem(resetKey, 'running')

        window.addEventListener('load', async () => {
          try {
            if ('serviceWorker' in navigator) {
              const registrations = await navigator.serviceWorker.getRegistrations()
              await Promise.all(registrations.map((registration) => registration.unregister()))
            }
            if ('caches' in window) {
              const keys = await caches.keys()
              await Promise.all(keys.filter((key) => key.startsWith('sila-')).map((key) => caches.delete(key)))
            }
          } catch (error) {
            console.warn('Brand cache reset could not fully complete.', error)
          } finally {
            localStorage.setItem(resetKey, 'done')
            const url = new URL(window.location.href)
            url.searchParams.set('brand', 'v8')
            window.location.replace(url.toString())
          }
        }, { once: true })
      })()
    </script>

    <div id="root"></div>
    <script>
      (() => {
        let hidden = false
        const hideSplash = () => {
          if (hidden) return
          hidden = true
          const splash = document.getElementById('sila-splash')
          if (!splash) return
          splash.classList.add('sila-splash-hide')
          window.setTimeout(() => splash.remove(), 450)
        }
        window.addEventListener('load', () => window.setTimeout(hideSplash, 550), { once: true })
        window.setTimeout(hideSplash, 4200)
      })()
    </script>
