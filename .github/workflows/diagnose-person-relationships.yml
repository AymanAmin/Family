name: Diagnose person relationships

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-person-relationships.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Inspect live relationship graph (read only)
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import { createClient } from '@supabase/supabase-js'

          const subjectId = '5f8d605d-b3bc-4afa-9bc4-51f0fb476919'
          const source = fs.readFileSync('src/lib/supabase.ts', 'utf8')
          const url = source.match(/fallbackProjectUrl\s*=\s*'([^']+)'/)?.[1]
          const key = source.match(/fallbackPublishableKey\s*=\s*'([^']+)'/)?.[1]
          if (!url || !key) throw new Error('Supabase browser configuration not found')

          const supabase = createClient(url, key, { auth: { persistSession: false, autoRefreshToken: false } })

          const personResult = await supabase.from('people')
            .select('id,full_name,gender,birth_year,status')
            .eq('id', subjectId)
            .maybeSingle()
          if (personResult.error) throw personResult.error
          if (!personResult.data) throw new Error('Subject person not visible/found')

          const directResult = await supabase.from('person_relationships')
            .select('id,source_person_id,target_person_id,relation_type,notes,status,source:people!person_relationships_source_person_id_fkey(id,full_name,gender,birth_year),target:people!person_relationships_target_person_id_fkey(id,full_name,gender,birth_year)')
            .or(`source_person_id.eq.${subjectId},target_person_id.eq.${subjectId}`)
            .in('status', ['approved','pending'])
            .order('created_at')
          if (directResult.error) throw directResult.error

          const [smart, extended] = await Promise.all([
            supabase.rpc('get_person_kinship', { p_person_id: subjectId }),
            supabase.rpc('get_person_extended_kinship', { p_person_id: subjectId }),
          ])

          const allParentEdges = []
          for (let from = 0; ; from += 1000) {
            const page = await supabase.from('person_relationships')
              .select('id,source_person_id,target_person_id,relation_type,status')
              .eq('status', 'approved')
              .in('relation_type', ['parent','child'])
              .range(from, from + 999)
            if (page.error) throw page.error
            allParentEdges.push(...(page.data ?? []))
            if ((page.data ?? []).length < 1000) break
          }

          const normalizePerson = (v) => Array.isArray(v) ? v[0] ?? null : v ?? null
          const direct = (directResult.data ?? []).map((r) => {
            const currentIsSource = r.source_person_id === subjectId
            const other = normalizePerson(currentIsSource ? r.target : r.source)
            let perspective = r.relation_type
            if (r.relation_type === 'parent') perspective = currentIsSource ? 'child' : 'parent'
            if (r.relation_type === 'child') perspective = currentIsSource ? 'parent' : 'child'
            return { ...r, other, perspective }
          })

          const issues = []
          const byOther = new Map()
          for (const r of direct.filter(r => r.status === 'approved')) {
            const otherId = r.other?.id ?? (r.source_person_id === subjectId ? r.target_person_id : r.source_person_id)
            const list = byOther.get(otherId) ?? []
            list.push(r)
            byOther.set(otherId, list)
          }
          for (const [otherId, rows] of byOther) {
            const types = new Set(rows.map(r => r.perspective))
            const hasLineage = types.has('parent') || types.has('child')
            const conflicts = []
            if (hasLineage && types.has('spouse')) conflicts.push('spouse + parent/child')
            if (hasLineage && types.has('sibling')) conflicts.push('sibling + parent/child')
            if (types.has('spouse') && types.has('sibling')) conflicts.push('spouse + sibling')
            if (types.has('parent') && types.has('child')) conflicts.push('both parent and child')
            if (conflicts.length) issues.push({ type: 'DIRECT_CONFLICT', otherId, otherName: rows[0].other?.full_name ?? '', conflicts, rows: rows.map(r => ({ id:r.id, stored:r.relation_type, perspective:r.perspective })) })

            const subjectYear = personResult.data.birth_year
            const otherYear = rows[0].other?.birth_year
            if (subjectYear && otherYear) {
              if (types.has('parent') && otherYear >= subjectYear) issues.push({ type: 'AGE_DIRECTION', otherId, otherName: rows[0].other?.full_name ?? '', message: `parent birth year ${otherYear} is not before subject ${subjectYear}` })
              if (types.has('child') && otherYear <= subjectYear) issues.push({ type: 'AGE_DIRECTION', otherId, otherName: rows[0].other?.full_name ?? '', message: `child birth year ${otherYear} is not after subject ${subjectYear}` })
            }
          }

          const parentEdges = allParentEdges.map(r => r.relation_type === 'parent'
            ? { parent: r.source_person_id, child: r.target_person_id, id: r.id }
            : { parent: r.target_person_id, child: r.source_person_id, id: r.id })
          const childrenByParent = new Map()
          for (const e of parentEdges) {
            const list = childrenByParent.get(e.parent) ?? []
            list.push(e)
            childrenByParent.set(e.parent, list)
          }
          const stack = [{ node: subjectId, path: [subjectId], edges: [] }]
          const seenStates = new Set()
          let cycle = null
          while (stack.length && !cycle) {
            const state = stack.pop()
            if (state.path.length > 20) continue
            for (const e of childrenByParent.get(state.node) ?? []) {
              if (e.child === subjectId) {
                cycle = { nodes: [...state.path, subjectId], edgeIds: [...state.edges, e.id] }
                break
              }
              const key = `${e.child}:${state.path.length}`
              if (state.path.includes(e.child) || seenStates.has(key)) continue
              seenStates.add(key)
              stack.push({ node: e.child, path: [...state.path, e.child], edges: [...state.edges, e.id] })
            }
          }
          if (cycle) issues.push({ type: 'ANCESTRY_CYCLE', ...cycle })

          console.log('=== SUBJECT ===')
          console.log(JSON.stringify(personResult.data, null, 2))
          console.log('=== DIRECT ===')
          console.log(JSON.stringify(direct.map(r => ({ id:r.id, status:r.status, stored:r.relation_type, perspective:r.perspective, other:r.other, notes:r.notes })), null, 2))
          console.log('=== SMART KINSHIP ===')
          console.log(JSON.stringify(smart.error ? { error: smart.error.message } : smart.data, null, 2))
          console.log('=== EXTENDED KINSHIP ===')
          console.log(JSON.stringify(extended.error ? { error: extended.error.message } : extended.data, null, 2))
          console.log('=== ISSUES ===')
          console.log(JSON.stringify(issues, null, 2))
          NODE
