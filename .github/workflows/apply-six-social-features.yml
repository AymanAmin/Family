name: Apply six social features

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-six-social-features.py'
      - '.github/workflows/apply-six-social-features.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply feature integration
        run: python3 scripts/apply-six-social-features.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify TypeScript and production build
        run: npm run build
      - name: Keep source changes only
        run: git restore index.html 404.html assets 2>/dev/null || true
      - name: Commit integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/main.tsx
          if ! git diff --cached --quiet; then
            git commit -m "Integrate six social features"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
