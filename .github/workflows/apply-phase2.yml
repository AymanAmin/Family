name: Apply directory phase two

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-phase2.py'
      - '.github/workflows/apply-phase2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply source patch
        run: python scripts/apply-phase2.py

      - name: Commit generated changes
        shell: bash
        run: |
          rm -f scripts/apply-phase2.py
          rm -f .github/workflows/apply-phase2.yml
          rm -f .github/workflows/phase-2-directory.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx supabase/SETUP.sql scripts/apply-phase2.py .github/workflows/apply-phase2.yml .github/workflows/phase-2-directory.yml
          git commit -m "Add family directory details relationships and Nasab-inspired dashboard"
          git push
