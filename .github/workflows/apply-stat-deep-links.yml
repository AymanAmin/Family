name: Apply statistic deep links

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-stat-deep-links.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply statistic navigation patch
        run: node scripts/apply-stat-deep-links.mjs

      - name: Commit statistic deep links
        run: |
          if git diff --quiet -- src/App.tsx src/components/DirectoryScreen.tsx; then
            echo "No statistic navigation changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/components/DirectoryScreen.tsx
          git commit -m "Open statistics on their exact tabs"
          git push
