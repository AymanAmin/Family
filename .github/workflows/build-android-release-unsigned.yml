name: Build Family Android unsigned release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-android-release-unsigned.yml'

permissions:
  contents: read

concurrency:
  group: family-android-release-unsigned
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build unsigned release APK
        working-directory: android
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Locate release APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -1)"
          test -n "$APK"
          test -s "$APK"
          cp "$APK" Family-release-unsigned.apk
          sha256sum Family-release-unsigned.apk

      - name: Upload unsigned release artifact
        uses: actions/upload-artifact@v4
        with:
          name: Family-Android-Release-Unsigned
          path: Family-release-unsigned.apk
          if-no-files-found: error
          retention-days: 7

      - name: Prepare Android signing utilities
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          mkdir -p android-signing-tools/lib android-signing-tools/lib64
          cp "$BUILD_TOOLS/apksigner" android-signing-tools/
          cp "$BUILD_TOOLS/zipalign" android-signing-tools/
          cp "$BUILD_TOOLS/lib/apksigner.jar" android-signing-tools/lib/
          LIBCPP="$(find "$BUILD_TOOLS" -type f -name 'libc++.so' | head -1)"
          test -n "$LIBCPP"
          cp "$LIBCPP" android-signing-tools/lib64/
          chmod +x android-signing-tools/apksigner android-signing-tools/zipalign

      - name: Upload Android signing utilities
        uses: actions/upload-artifact@v4
        with:
          name: Android-Signing-Tools-35
          path: android-signing-tools
          if-no-files-found: error
          retention-days: 1
