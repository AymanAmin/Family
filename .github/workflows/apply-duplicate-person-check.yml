name: Apply duplicate person check

on:
  push:
    paths:
      - '.github/workflows/apply-duplicate-person-check.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Integrate duplicate-person check
        run: node scripts/apply-duplicate-person-check.mjs
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify production build
        run: npm run build
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx index.html
          if ! git diff --cached --quiet; then
            git commit -m "Add smart duplicate check to person form"
            git push
          fi
