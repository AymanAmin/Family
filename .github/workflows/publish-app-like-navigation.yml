name: Publish app-like navigation build

on:
  push:
    paths:
      - '.github/workflows/publish-app-like-navigation.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: family-app-like-navigation-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Publish production build to main root
        shell: bash
        run: |
          rm -rf assets icons brand
          cp -R dist/assets assets
          cp -R dist/icons icons
          cp -R dist/brand brand
          cp dist/index.html index.html
          cp dist/404.html 404.html
          cp dist/manifest.webmanifest manifest.webmanifest
          cp dist/sw.js sw.js
          touch .nojekyll

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html 404.html .nojekyll assets icons brand manifest.webmanifest sw.js

          if git diff --cached --quiet; then
            echo "Published root files are already current."
          else
            git commit -m "Publish app-like navigation build [skip ci]"
            git push
          fi
