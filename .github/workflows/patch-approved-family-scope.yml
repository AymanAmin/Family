name: Apply approved-family scope picker

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch-approved-family-scope.py'
      - '.github/workflows/patch-approved-family-scope.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: python3 scripts/patch-approved-family-scope.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify
        run: npm run build
      - name: Keep source changes only
        run: git restore index.html 404.html assets 2>/dev/null || true
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/AdminUserRoles.tsx
          if ! git diff --cached --quiet; then
            git commit -m "Restrict moderator scope picker to approved families"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
