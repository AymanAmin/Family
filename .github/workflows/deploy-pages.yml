name: Build and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://rtmdaalabudycimnnena.supabase.co' }}
  VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_hEgXfE49mamGngH0tIs8CA_P3QrKNYT' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check and build
        run: npm run build

      - name: Keep a production build in the repository root
        shell: bash
        run: |
          rm -rf assets
          cp -R dist/assets assets
          cp dist/index.html index.html
          cp dist/404.html 404.html
          touch .nojekyll

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html 404.html .nojekyll assets

          if git diff --cached --quiet; then
            echo "Published root files are already current."
          else
            git commit -m "Publish production build [skip ci]"
            if git push; then
              echo "Published root build pushed."
            else
              echo "Remote changed during build; retrying once after rebase."
              if git pull --rebase origin main && git push; then
                echo "Published root build pushed after rebase."
              else
                git rebase --abort >/dev/null 2>&1 || true
                echo "Root mirror push skipped because another workflow updated main. Pages artifact deployment will continue."
              fi
            fi
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
