name: Fix SQL COALESCE qualification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-sql-coalesce.yml'
      - 'supabase/SETUP.sql'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix schema-qualified COALESCE
        shell: bash
        run: |
          sed -i 's/pg_catalog\.coalesce/coalesce/g' supabase/SETUP.sql

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/SETUP.sql

          if git diff --cached --quiet; then
            echo "SETUP.sql is already corrected."
          else
            git commit -m "Fix COALESCE usage in Supabase setup [skip ci]"
            git push
          fi
