name: Build and publish GitHub Pages root

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: family-pages-root
  cancel-in-progress: true

env:
  VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://rtmdaalabudycimnnena.supabase.co' }}
  VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_hEgXfE49mamGngH0tIs8CA_P3QrKNYT' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check and build
        run: npm run build

      - name: Publish production build to main root
        shell: bash
        run: |
          rm -rf assets icons brand
          cp -R dist/assets assets
          cp -R dist/icons icons
          cp -R dist/brand brand
          cp dist/index.html index.html
          cp dist/404.html 404.html
          cp dist/manifest.webmanifest manifest.webmanifest
          cp dist/sw.js sw.js
          touch .nojekyll

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html 404.html .nojekyll assets icons brand manifest.webmanifest sw.js

          if git diff --cached --quiet; then
            echo "Published root files are already current."
          else
            git commit -m "Publish production build [skip ci]"
            if git push; then
              echo "Published root build pushed. GitHub Pages will publish from main root."
            else
              echo "Remote changed during build; retrying once after rebase."
              if git pull --rebase origin main && git push; then
                echo "Published root build pushed after rebase. GitHub Pages will publish from main root."
              else
                git rebase --abort >/dev/null 2>&1 || true
                echo "Root mirror push skipped because another workflow updated main."
                exit 1
              fi
            fi
          fi
