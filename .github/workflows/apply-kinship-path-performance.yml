name: Apply kinship path performance

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-kinship-path-performance.mjs'
      - '.github/workflows/apply-kinship-path-performance.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply kinship performance changes
        run: node scripts/apply-kinship-path-performance.mjs

      - name: Install dependencies
        run: npm install

      - name: Verify TypeScript and production build
        run: npm run build

      - name: Commit integration
        run: |
          if git diff --quiet -- src/components/FamilyTreeScreen.tsx src/App.tsx supabase/SETUP.sql; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/FamilyTreeScreen.tsx src/App.tsx supabase/SETUP.sql
          git commit -m "Optimize kinship path page performance"
          git pull --rebase origin main
          git push origin HEAD:main
